[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yue2-studio"
dynamic = ["version"]
description = "Gradio studio for running YuE2 song generation on Google Colab L4"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# Runtime dependencies live in requirements-colab.txt: YuE2 pins torch and
# friends exactly, so Colab installs must go through that one file.
dependencies = []

[project.optional-dependencies]
dev = [
    "gradio==6.17.3",
    "numpy==2.2.6",
    "huggingface-hub==0.36.2",
    "soundfile==0.13.1",
    "ruff",
    "pytest",
    "pytest-cov",
    "nbformat",
]

[tool.setuptools.dynamic]
version = { attr = "yue2_studio.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The notebook is generated by scripts/build_notebook.py.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long Chinese sentences read better unbroken.
"src/yue2_studio/ui_text.py" = ["E501"]
"scripts/build_notebook.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["yue2_studio"]
omit = [
    # Entry points that only run on a Colab GPU runtime.
    "src/yue2_studio/launch.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
