name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # yue2-infer and torch are deliberately not installed: every test runs
      # on the stand-in pipeline.
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Notebook is up to date
        run: |
          python scripts/build_notebook.py
          git diff --exit-code YuE2_Colab_Studio.ipynb
      - name: Test
        run: pytest -q --cov=yue2_studio --cov-report=term-missing --cov-fail-under=80
